name: 功能建议 / Feature request
description: 希望增加或改进的功能 / Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: part
    attributes:
      label: 相关部分 / Related part
      options: [服务端 Host, Windows 客户端, Mac 客户端, iOS 客户端, Android 客户端, 网页版 / Web client, 新平台 / New platform, 文档 / Docs, 其他 / Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem should this solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法 / Your idea
