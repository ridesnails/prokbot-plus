<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e0e0e" />
    <title>Grok Bot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/stage.css" />
    <link rel="stylesheet" href="/web-login.css" />
    <script src="/theme.js"></script>
    <script type="module" src="/web-login.js"></script>
  </head>
  <body>
    <div id="web-login" class="auth theme-dark">
      <header class="auth-top">
        <span class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-face" width="32" height="32" rx="9"/><rect class="brand-eye" x="9.6" y="11" width="4.4" height="10.5" rx="2.2" transform="rotate(-28 11.8 16.25)"/><rect class="brand-eye" x="18.4" y="9.5" width="4.4" height="8.5" rx="2.2" transform="rotate(-28 20.6 13.75)"/></svg><span>Grok Bot <small>网页版</small></span></span>
      </header>
      <main class="auth-talk web-talk">
        <h1 id="web-title">登录网页版</h1>
        <p id="web-lead" class="web-lead">在 Host 管理页「设备与通知」创建 6 位配对码，输入后即可在这个浏览器里使用你的 Bot。</p>
        <form id="web-form" class="web-form" hidden>
          <p id="web-message" class="auth-bubble" role="alert" hidden></p>
          <div class="composer">
            <label class="sr-only" for="web-code">配对码</label>
            <input id="web-code" name="code" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" autocorrect="off" spellcheck="false" maxlength="12" required placeholder="6 位配对码" />
            <button id="web-submit" class="send-btn icon-btn" type="submit" aria-label="登录"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </form>
        <section id="web-paired" class="web-paired" hidden>
          <p id="web-device" class="web-device"></p>
          <div class="web-actions"><button id="web-logout" class="btn" type="button">退出登录</button><a id="web-open" class="btn btn-primary" href="/web/">进入网页版</a></div>
        </section>
        <p id="web-status" class="web-note" role="status" hidden></p>
        <p id="web-insecure" class="web-note" hidden>这个地址没有加密（http）。网页版可以用，但语音输入、麦克风和浏览器通知需要 https 地址；在公网使用时请配置 https。</p>
      </main>
      <div id="web-face" class="auth-horizon"></div>
    </div>
  </body>
</html>
